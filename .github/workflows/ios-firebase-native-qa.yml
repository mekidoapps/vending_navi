name: VendingNavi one-time unsigned Firebase QA (iOS isolation)
on:
  push:
    branches: ['qa/ios-firestore-12-19-3-20261128']
    paths: ['.github/workflows/ios-firebase-native-qa.yml']
permissions:
  contents: read
concurrency:
  group: vending-ios-firebase-qa-20261128
  cancel-in-progress: false
jobs:
  unsigned:
    if: >-
      github.repository == 'mekidoapps/vending_navi' &&
      github.event_name == 'push' &&
      github.event.repository.private == false &&
      github.event.before == 'c187c44e8d5e078937801e1072926553bda1f2db' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ci: run one isolated unsigned Firestore 12.19.3 QA verification'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      BASE: c187c44e8d5e078937801e1072926553bda1f2db
      LOCK_SHA256: 432db3e9c79592bb94cdd2f7a8480187d4eee5b9d2937fa5d7c670da76bbf50b
      PBX_BEFORE_BLOB: 6e5a808a48b277db7c78d93be088760bf6f8155d
      PBX_REVIEWED_BLOB: ead4ad43cce738536c76095832177788f427d0b8
      PBX_REVIEWED_SHA256: b1bb01da25f2309458271cde0927baf549b3c67031f0d231a745c8fae4a6ae52
      COCOAPODS_DISABLE_STATS: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check exact parent, path allowlist and Xcode
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          diff -u <(printf '%s\n' .github/workflows/ios-firebase-native-qa.yml) <(git diff --name-only "$BASE" HEAD)
          shasum -a 256 -c <<'EOF'
          735eb089361d582d4fa18aa377cadcf85afd4a1adf95f31e00c9ecc193acb953  ios/Podfile
          8a25c22a01fb1a478a7361ddf357679ae9e9996397b45126eb8756a4bd73121d  ios/Runner.xcodeproj/project.pbxproj
          eb860729ceb91ca52433c57d4ba9f9706295be92e201b56fa44fdae4a44715cb  pubspec.lock
          8d896f31d11d7602cbdf0d0b41e0d4f886890920ae2adbbb868eee347d46b0e3  pubspec.yaml
          EOF
          test "$(git hash-object --no-filters ios/Runner.xcodeproj/project.pbxproj)" = "$PBX_BEFORE_BLOB"
          test -f ios/Podfile.lock && test ! -L ios/Podfile.lock
          printf '%s  %s\n' "$LOCK_SHA256" ios/Podfile.lock | shasum -a 256 -c -
          test ! -e ios/Flutter/LocalServices.xcconfig && test ! -L ios/Flutter/LocalServices.xcconfig
          xcodebuild -version | grep -Fx 'Xcode 26.3'
          test "$(pod --version)" = '1.17.0'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Install exact public Pods and verify reviewed integration

          printf '%s  %s\n' "$PBX_REVIEWED_SHA256" ios/Runner.xcodeproj/project.pbxproj | shasum -a 256 -c -
          test "$(git hash-object --no-filters ios/Runner.xcodeproj/project.pbxproj)" = "$PBX_REVIEWED_BLOB"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -showBuildSettings > "$RUNNER_TEMP/ios-qa-build-settings.txt"
          python3 - <<'PY'
          import hashlib, json, os, plistlib, re
          from pathlib import Path
          app = Path('build/ios/iphoneos/Runner.app')
          plist = plistlib.loads((app/'Info.plist').read_bytes())
          entitlements = plistlib.loads(Path('ios/Runner/Runner.entitlements').read_bytes())
          block = (Path(os.environ['RUNNER_TEMP'])/'ios-qa-build-settings.txt').read_text().split('and target Runner:',1)[1].split('Build settings for action ',1)[0]
          assert re.search(r'^\s*IPHONEOS_DEPLOYMENT_TARGET = 15(?:\.0)+\s*$',block,re.M)
          assert re.search(r'^\s*TARGETED_DEVICE_FAMILY = 1\s*$',block,re.M)
          assert re.search(r'^\s*CODE_SIGN_ENTITLEMENTS = Runner/Runner\.entitlements\s*$',block,re.M)
          assert plist['MinimumOSVersion'] in ('15.0','15.0.0')
          assert plist['UIDeviceFamily'] == [1]
          assert plist['CFBundleIdentifier'] == 'com.mekidoapps.vendingnavi'
          assert entitlements['com.apple.developer.applesignin'] == ['Default']
          assert plist.get('GoogleMapsAPIKey','') == ''
          assert not Path('ios/Flutter/LocalServices.xcconfig').exists()
          assert not (app/'_CodeSignature').exists() and not (app/'embedded.mobileprovision').exists()
          maps_bundles = [p for p in app.rglob('GoogleMaps.bundle') if p.is_dir()]
          privacy_files = [p for p in app.rglob('PrivacyInfo.xcprivacy') if p.is_file()]
          maps_privacy_files = [p for p in privacy_files if 'googlemaps' in str(p.relative_to(app)).lower()]
          # Log only bounded resource counts, never service values.
          print('QA_MAPS_RESOURCES_JSON ' + json.dumps(dict(mapsBundles=len(maps_bundles),
                privacyManifests=len(privacy_files),mapsPrivacyManifests=len(maps_privacy_files))), flush=True)
          data = dict(source=os.environ['GITHUB_SHA'], minimumOS=plist['MinimumOSVersion'], deviceFamily=plist['UIDeviceFamily'],
                      binarySHA256=hashlib.sha256((app/'Runner').read_bytes()).hexdigest(),
                      lockSHA256=hashlib.sha256(Path('ios/Podfile.lock').read_bytes()).hexdigest(),
                      appleSignInEntitlement=True, emptyMapsConfiguration=True, noCodeSignature=True,
                      mapsResourceBundles=len(maps_bundles), privacyManifests=len(privacy_files),
                      mapsPrivacyManifests=len(maps_privacy_files))
          Path('qa-evidence/build-result.json').write_text(json.dumps(data,indent=2)+'\n')
          print('QA_BUILD_JSON ' + json.dumps(data,sort_keys=True), flush=True)
          assert maps_bundles and privacy_files
          assert all(isinstance(plistlib.loads(p.read_bytes()), dict) for p in maps_privacy_files)
          PY

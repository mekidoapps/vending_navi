name: iOS unsigned compile

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed full commit SHA of the selected branch (not old main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check reviewed source and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -Eq '^version: 1\.0\.0\+21[[:space:]]*$' pubspec.yaml
          test -f ios/Podfile
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26
          pod --version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Resolve locked Flutter dependencies
        run: |
          flutter --version
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Compile release for iPhone without signing
        run: flutter build ios --release --no-codesign --dart-define=APP_ENTRY=v2
      - name: Verify output and record safe evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f build/ios/iphoneos/Runner.app/Runner
          git diff --exit-code -- pubspec.yaml pubspec.lock
          {
            echo 'Unsigned compile succeeded; no device installation or distribution verified.'
            echo "Source: $(git rev-parse HEAD)"
            echo 'Entry: APP_ENTRY=v2; version: 1.0.0+21; Flutter: 3.41.2'
            xcodebuild -version
            echo "iPhone SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
            echo "CocoaPods: $(pod --version)"
            shasum -a 256 ios/Podfile.lock
          } >> "$GITHUB_STEP_SUMMARY"
          # Native dependency resolution is not reproducible until the first
          # reviewed successful macOS run supplies a versioned Podfile.lock.
          # Do not upload app binaries or configuration files to a public repo.
